name: Render and publish to gh-pages

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pandas torch transformers umap-learn scikit-learn

      - name: Download model & regenerate representations (0.5B)
        run: |
          python extract_representations.py

      - name: Regenerate geometry figures
        run: |
          python analyze_geometry.py

      - name: Regenerate attention figures
        run: |
          python attention_tracing.py

      - name: Regenerate ablation figures
        run: |
          python train_ablation.py

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.42"

      - name: Render Quarto document
        run: quarto render report_geometry_of_meaning.qmd --to html

      - name: Publish to GitHub Pages (gh-pages branch)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
