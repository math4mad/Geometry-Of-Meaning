name: Render and publish to gh-pages

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pandas torch transformers umap-learn scikit-learn

      - name: Regenerate representations (0.5B)
        run: |
          python extract_representations.py

      - name: Regenerate geometry figures
        run: |
          python analyze_geometry.py

      - name: Regenerate attention figures
        run: |
          python attention_tracing.py

      # NOTE: train_ablation.py is skipped in CI — LoRA training on CPU
      # is too slow (30+ min). Ablation figures are committed to the repo
      # and can be regenerated locally with GPU/MPS.

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.42"

      - name: Render Quarto to docs/
        run: |
          quarto render report_geometry_of_meaning.qmd --to html --output-dir docs --output index.html
          quarto render report_geometry_of_meaning_7b.qmd --to html --output-dir docs/7b --output index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
